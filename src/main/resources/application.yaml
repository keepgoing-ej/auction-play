spring:
  datasource:
    url: jdbc:mysql://localhost:3307/auctiondb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080


jwt:
  secret: auctionplay-secret-key-for-jwt-must-be-at-least-32-bytes-long-1234
  access-token-validity: 86400000